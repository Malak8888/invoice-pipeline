apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-api
  template:
    metadata:
      labels:
        app: invoice-api
    spec:
      containers:
        - name: api
          image: invoice-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_URI
              value: models:/invoice_late_payment_sk@staging
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-api
  namespace: staging
spec:
  selector:
    app: invoice-api
  ports:
    - port: 80
      targetPort: 8000