apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invoice-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Malak8888/invoice-pipeline.git
    targetRevision: main
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invoice-preprod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Malak8888/invoice-pipeline.git
    targetRevision: main
    path: k8s/preprod
  destination:
    server: https://kubernetes.default.svc
    namespace: preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true